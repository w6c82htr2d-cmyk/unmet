<!doctype html><html><head><meta charset="utf-8"><script>
(function(){
  var q = new URLSearchParams(location.search);
  var route = q.get('r') || '';
  var theme = q.get('theme') || 'dark';
  var lang = q.get('lang') || 'en';
  var empty = q.get('empty') === '1';
  function d(off){var x=new Date();x.setDate(x.getDate()+off);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
  function dow(s){return new Date(s+'T00:00:00').getDay();}
  localStorage.clear();
  localStorage.setItem('unmet_profile', JSON.stringify({firstName:'Layla', goalTracks:['gpa','fitness'], onboarded:true}));
  localStorage.setItem('unmet_tour_seen','1');
  localStorage.setItem('unmet_theme', theme);
  localStorage.setItem('unmet_lang', lang);
  if (q.get('view')) localStorage.setItem('unmet_calendar_view', JSON.stringify(q.get('view')));
  if (!empty) {
    var ev=[]; var start=d(-60);
    [0,2,4].forEach(function(w){ev.push({id:'cls'+w,seriesId:'cls',title:'Classes',type:'weekly',dayOfWeek:w,startDate:start,start:'08:00',end:'10:50',source:'manual'});});
    [1,3].forEach(function(w){ev.push({id:'wrk'+w,seriesId:'wrk',title:'Part-time work',type:'weekly',dayOfWeek:w,startDate:start,start:'13:00',end:'17:00',source:'manual'});});
    ev.push({id:'gym',seriesId:'gym',title:'Gym class',type:'weekly',dayOfWeek:6,startDate:start,start:'09:00',end:'10:00',source:'manual'});
    ev.push({id:'dent',seriesId:'dent',title:'Dentist',type:'once',date:d(0),start:'15:30',end:'16:15',source:'manual'});
    ev.push({id:'study',seriesId:'study',title:'Study group',type:'once',date:d(0),start:'15:45',end:'17:00',source:'manual'});
    localStorage.setItem('unmet_events', JSON.stringify(ev));
    var hab=[
      {id:'h1',name:'Review math notes',scheduleType:'stacked',stackEventIds:['cls0','cls2','cls4'],offsetMinutes:10,duration:30,history:{},createdAt:d(-45)},
      {id:'h2',name:'Read 20 pages',scheduleType:'independent',time:'21:30',duration:20,history:{},createdAt:d(-45)},
      {id:'h3',name:'Stretch',scheduleType:'independent',days:[1,3,5],time:'07:00',duration:15,history:{},createdAt:d(-45)},
      {id:'h4',name:'Walk home, no phone',scheduleType:'stacked',stackEventIds:['wrk1','wrk3'],offsetMinutes:0,duration:25,history:{},createdAt:d(-45)}
    ];
    // deterministic pseudo-random ~72% completion over the past 40 days, today partly done
    var seed=7; function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
    for (var o=-40;o<0;o++){ var day=d(o); hab.forEach(function(h){ if (rnd()<0.72) h.history[day]=true; }); }
    hab[1].history[d(0)]=true;
    localStorage.setItem('unmet_habits', JSON.stringify(hab));
    localStorage.setItem('unmet_goals', JSON.stringify([{id:'g1',text:'Prepare for my chemistry midterm',createdAt:new Date().toISOString(),subtasks:[
      {id:'st0',text:'Review lecture notes from weeks 1-4',importance:'hi',urgency:'hi',done:true,lastTouched:new Date().toISOString()},
      {id:'st1',text:'Do practice problems for chapter 5',importance:'hi',urgency:'hi',done:false,lastTouched:new Date().toISOString()},
      {id:'st2',text:'Email TA about the titration question',importance:'lo',urgency:'hi',done:false,lastTouched:new Date().toISOString()},
      {id:'st3',text:'Book a study room for Thursday',importance:'lo',urgency:'lo',done:false,lastTouched:new Date().toISOString()}]}]));
  }
  location.replace('/index.html#/' + route);
})();
</script></head><body></body></html>
